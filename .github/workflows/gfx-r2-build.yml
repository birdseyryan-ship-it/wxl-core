name: GFX-R3 Win32 Build

on:
  push:
    branches:
      - gfx-r3-modern-aa
      - gfx-r4-environment
      - gfx-r5-shadows
      - gfx-r6-water-diagnostics
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build-r3:
    runs-on: windows-latest

    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show source authority
        run: |
          Write-Host "Commit: $env:GITHUB_SHA"
          git status --short --branch
          git log -1 --format="Commit: %H%nParent: %P%nSubject: %s"

      - name: Configure Win32
        run: cmake -S . -B build-r3 -A Win32

      - name: Build WarcraftXL
        run: cmake --build build-r3 --config Release --target WarcraftXL --parallel

      - name: Build d3d9 proxy
        run: cmake --build build-r3 --config Release --target d3d9 --parallel

      - name: Configure R5 receiver checks
        if: github.ref == 'refs/heads/gfx-r5-shadows' || github.ref == 'refs/heads/gfx-r6-water-diagnostics'
        run: cmake -S tools/r5-receiver-check -B build-r5check -A Win32

      - name: Build R5 receiver checks
        if: github.ref == 'refs/heads/gfx-r5-shadows' || github.ref == 'refs/heads/gfx-r6-water-diagnostics'
        run: cmake --build build-r5check --config Release --parallel

      - name: Validate R5 projection and assemble receiver modes
        if: github.ref == 'refs/heads/gfx-r5-shadows' || github.ref == 'refs/heads/gfx-r6-water-diagnostics'
        run: .\build-r5check\Release\R5ReceiverSmoke.exe

      - name: Configure R6 diagnostic checks
        if: github.ref == 'refs/heads/gfx-r6-water-diagnostics'
        run: cmake -S tools/r6-water-check -B build-r6check -A Win32

      - name: Build and validate R6 diagnostic policy
        if: github.ref == 'refs/heads/gfx-r6-water-diagnostics'
        run: |
          cmake --build build-r6check --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build-r6check\Release\R6WaterCheck.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/r6-water-check -p test_capture.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage R3 binaries
        run: |
          New-Item -ItemType Directory -Force -Path dist-r3 | Out-Null
          Copy-Item "build-r3\Release\WarcraftXL.dll" "dist-r3\WarcraftXL.dll"
          Copy-Item "build-r3\Release\d3d9.dll" "dist-r3\d3d9.dll"

      - name: Record binary hashes
        run: |
          $files = @(
            "dist-r3\WarcraftXL.dll",
            "dist-r3\d3d9.dll"
          )
          foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            $name = Split-Path $file -Leaf
            "$hash  $name" | Tee-Object -FilePath "dist-r3\SHA256SUMS.txt" -Append
          }
          Get-Content "dist-r3\SHA256SUMS.txt"

      - name: Upload R3 candidate
        uses: actions/upload-artifact@v4
        with:
          name: gfx-r3-candidate-${{ github.sha }}
          path: |
            dist-r3/WarcraftXL.dll
            dist-r3/d3d9.dll
            dist-r3/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
