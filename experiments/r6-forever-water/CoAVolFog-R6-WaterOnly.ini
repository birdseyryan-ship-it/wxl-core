; R6 Forever-water-only qualification profile.
; Upstream: jealous-sound/coa-vfog @ 4e31ddf53a326ba9c0ad03488b4c30f7ce23c969
; Intent: change water only. Preserve stock/accepted fog, lighting, far clip and grading for R0-R5/R7 isolation.
[CoAVolFog]
Enable=1
EngineHooks=1
Overlay=1
OverlayKey=Ctrl+F7

; Keep the fog renderer visually inert for R6.
Quality=2
Density=0.0
Haze=0.0
GroundFog=0.0
FarFog=0.0
NoiseAmount=0.0
NoiseScale=0.025
NoiseWindSpeed=0.5
ClassicNoise=0
StockFog=0
TransparentFog=0
DataMode=0
ColorSpace=1
SunScatter=0.0
Ambient=0.0
Exposure=0.0
ClassicExposure=0.0
ClassicPhase=0
LocalLights=0
LocalLightIntensity=0.0
LocalLightPhase=0.3
InteriorAware=0
InteriorDensity=0.0
GodRays=0
GlowCompensation=0
ForeverGlow=0
ColorGrading=0

; Do not alter the accepted R4 view-distance policy.
FarClipMax=0
MaxDistance=5000
Temporal=0
Underwater=0

; Water/depth compatibility.
LiquidDepth=1
Multisampling=1

; R6 target: Forever-derived modern water.
Water=1
WaterQuality=3
WaterWaves=1.0
WaterWind=2.0
WaterFoam=1.0
WaterReflections=1.0
WaterSpecular=1.0
WaterClarity=1.0
WaterZoneColors=0.5
WaterRipples=0.5
WaterClientSplashes=0
WaterDebugView=0

; No fog debug overlays.
DebugView=0
SunMarker=0
LogLevel=2
