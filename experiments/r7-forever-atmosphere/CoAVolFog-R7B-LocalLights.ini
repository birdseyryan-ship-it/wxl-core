; R7B — local-light scattering qualification profile.
; Base authority: accepted R6 live authority on 2026-10-01.
; Intent: keep the locked R7A atmosphere/water baseline and enable only local-light fog scattering.
; Keep R4 far clip authoritative; preserve R6 water except the separately-qualified WaterWind=1.5 visual micro-tune; keep later R7 lighting/look features off.
[CoAVolFog]
Enable=1
EngineHooks=1
Overlay=1
OverlayKey=Ctrl+F7

; Core volumetric fog.
Quality=2
Density=1.0
Haze=1.0
GroundFog=0.6
FarFog=1.0
NoiseAmount=0.15
NoiseScale=0.025
NoiseWindSpeed=0.5
ClassicNoise=1
StockFog=1
TransparentFog=0
DataMode=1
ColorSpace=1
SunScatter=1.0
Ambient=1.0
Exposure=1.0
ClassicExposure=1.0
ClassicPhase=0

; R7B delta: enable local-light fog scattering at the upstream calibration.
LocalLights=1
LocalLightIntensity=1.0
LocalLightPhase=0.3

; Core interior transition is part of fog ownership.
InteriorAware=1
InteriorDensity=0.15

; R7C+ reserved.
GodRays=0
GlowCompensation=1
ForeverGlow=0
ColorGrading=0

; Frozen R4 authority: CoAVolFog must not own far clip.
FarClipMax=0
MaxDistance=5000
Temporal=0.85
Underwater=0

; Accepted R6 depth/MSAA/water authority, plus locked R7A visual micro-tune.
LiquidDepth=1
Multisampling=1
Water=1
WaterQuality=3
WaterWaves=1.0
WaterWind=1.5
WaterFoam=1.0
WaterReflections=0.75
WaterSpecular=1.0
WaterClarity=1.0
WaterZoneColors=0.5
WaterRipples=0.5
WaterClientSplashes=0
WaterDebugView=0

DebugView=0
SunMarker=0
LogLevel=2
