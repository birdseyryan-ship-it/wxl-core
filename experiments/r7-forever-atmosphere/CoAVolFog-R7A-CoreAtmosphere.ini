; R7A — core Forever/Classic atmosphere qualification profile.
; Base authority: accepted R6 live authority on 2026-10-01.
; Intent: enable only the volumetric/Classic fog core over frozen R0-R6.
; Keep R4 far clip authoritative, R6 water unchanged, and later R7 lighting/look features off.
[CoAVolFog]
Enable=1
EngineHooks=1
Overlay=1
OverlayKey=Ctrl+F7

; Core volumetric fog.
Quality=2
Density=1.0
Haze=1.0
GroundFog=0.6
FarFog=1.0
NoiseAmount=0.15
NoiseScale=0.025
NoiseWindSpeed=0.5
ClassicNoise=1
StockFog=1
TransparentFog=0
DataMode=1
ColorSpace=1
SunScatter=1.0
Ambient=1.0
Exposure=1.0
ClassicExposure=1.0
ClassicPhase=0

; R7B+ reserved: local-light fog scattering remains off in R7A.
LocalLights=0
LocalLightIntensity=1.0
LocalLightPhase=0.3

; Core interior transition is part of fog ownership.
InteriorAware=1
InteriorDensity=0.15

; R7C+ reserved.
GodRays=0
GlowCompensation=1
ForeverGlow=0
ColorGrading=0

; Frozen R4 authority: CoAVolFog must not own far clip.
FarClipMax=0
MaxDistance=5000
Temporal=0.85
Underwater=0

; Accepted R6 depth/MSAA/water authority.
LiquidDepth=1
Multisampling=1
Water=1
WaterQuality=3
WaterWaves=1.0
WaterWind=2.0
WaterFoam=1.0
WaterReflections=0.75
WaterSpecular=1.0
WaterClarity=1.0
WaterZoneColors=0.5
WaterRipples=0.5
WaterClientSplashes=0
WaterDebugView=0

DebugView=0
SunMarker=0
LogLevel=2
